  <circle cx="170" cy="210" r="14" fill="#10B981"/>
  <circle cx="210" cy="210" r="14" fill="#6366F1" stroke="#F8FAFC" stroke-width="2"/>
  <circle cx="250" cy="210" r="14" fill="#334155"/>
