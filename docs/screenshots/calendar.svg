<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
  </defs>
  <rect width="360" height="640" rx="32" fill="url(#bg5)" stroke="#334155" stroke-width="2"/>
  
  <text x="24" y="55" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="20" font-weight="bold">Calendar &amp; Session Logs</text>
  
