  <rect x="20" y="80" width="320" height="240" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="36" y="110" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="bold">August 2026</text>
  
  <g fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" text-anchor="middle">
    <text x="50" y="140">M</text><text x="90" y="140">T</text><text x="130" y="140">W</text>
    <text x="170" y="140">T</text><text x="210" y="140">F</text><text x="250" y="140">S</text><text x="290" y="140">S</text>
  </g>

  <!-- Calendar Day Badges -->
  <circle cx="50" cy="170" r="14" fill="#334155"/>
  <circle cx="90" cy="170" r="14" fill="#10B981"/>
  <circle cx="130" cy="170" r="14" fill="#10B981"/>
  <circle cx="170" cy="170" r="14" fill="#059669"/>
  <circle cx="210" cy="170" r="14" fill="#10B981"/>
  <circle cx="250" cy="170" r="14" fill="#047857"/>
  <circle cx="290" cy="170" r="14" fill="#10B981"/>

  <circle cx="50" cy="210" r="14" fill="#10B981"/>
  <circle cx="90" cy="210" r="14" fill="#059669"/>
