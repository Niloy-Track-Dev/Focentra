name: Build Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create release for (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Prepare Release Keystore & Signing Credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding provided KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "STORE_PASS=${STORE_PASSWORD_SECRET:-android}" >> $GITHUB_ENV
            echo "KEY_PASS=${KEY_PASSWORD_SECRET:-android}" >> $GITHUB_ENV
          else
            echo "No KEYSTORE_BASE64 secret provided. Auto-generating a release signing keystore on the fly..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Focentra, OU=App, O=Niloy, L=Dhaka, S=Dhaka, C=BD"
            echo "STORE_PASS=android" >> $GITHUB_ENV
            echo "KEY_PASS=android" >> $GITHUB_ENV
          fi
          echo "Keystore is ready at $(pwd)/my-upload-key.jks"

      - name: Recreate .env file
        env:
          ENV_FILE_CONTENTS: ${{ secrets.ENV_FILE_CONTENTS }}
        run: |
          if [ -n "$ENV_FILE_CONTENTS" ]; then
            echo "$ENV_FILE_CONTENTS" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ env.STORE_PASS }}
          KEY_PASSWORD: ${{ env.KEY_PASS }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Extract App Version Name
        id: get_version
        run: |
          VERSION=$(grep "versionName" app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="1.1.0"
          fi
          echo "APP_VERSION=v$VERSION" >> $GITHUB_ENV
          echo "VERSION_RAW=$VERSION" >> $GITHUB_ENV
          echo "Detected App Version: v$VERSION"

      - name: Copy & Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk focentra-${{ env.APP_VERSION }}-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: focentra-release-apk
          path: focentra-${{ env.APP_VERSION }}-release.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || env.APP_VERSION }}
          name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || format('Focentra {0}', env.APP_VERSION) }}
          files: focentra-${{ env.APP_VERSION }}-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
