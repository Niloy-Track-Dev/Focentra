name: Build Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Keystore & Signing Credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding provided KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "STORE_PASS=${STORE_PASSWORD_SECRET:-android}" >> $GITHUB_ENV
            echo "KEY_PASS=${KEY_PASSWORD_SECRET:-android}" >> $GITHUB_ENV
          else
            echo "No KEYSTORE_BASE64 secret provided. Auto-generating a release signing keystore on the fly..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Focentra, OU=App, O=Niloy, L=Dhaka, S=Dhaka, C=BD"
            echo "STORE_PASS=android" >> $GITHUB_ENV
            echo "KEY_PASS=android" >> $GITHUB_ENV
          fi
          echo "Keystore is ready at $(pwd)/my-upload-key.jks"

      - name: Recreate .env file
        env:
          ENV_FILE_CONTENTS: ${{ secrets.ENV_FILE_CONTENTS }}
        run: |
          if [ -n "$ENV_FILE_CONTENTS" ]; then
            echo "$ENV_FILE_CONTENTS" > .env
            echo ".env created from ENV_FILE_CONTENTS secret."
          elif [ -f .env.example ]; then
            cp .env.example .env
            echo ".env fallback created from .env.example."
          else
            touch .env
            echo "Empty .env created as fallback."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ env.STORE_PASS }}
          KEY_PASSWORD: ${{ env.KEY_PASS }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk apk-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: apk-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-release.apk
          generate_release_notes: true
